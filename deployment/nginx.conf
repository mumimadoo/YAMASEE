# Nginx Staging & Production Configuration for YAMASEE Platform

upstream yamasee_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name staging.yamasee.internal;

    # HTTP to HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.yamasee.internal;

    # SSL Certificates
    ssl_certificate /etc/ssl/certs/yamasee_staging.crt;
    ssl_certificate_key /etc/ssl/certs/yamasee_staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Request Body Limits (HTTP 413)
    client_max_body_size 2060M;
    client_body_buffer_size 16m;

    # Disable Directory Listing
    autoindex off;

    # Static Files Serving
    location /static/ {
        alias /var/www/yamasee/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        autoindex off;
    }

    # Block Runtime Diagnostics in Production/Staging
    location /diagnostics/runtime {
        return 403 "Forbidden";
    }

    # Restrict Operational Metrics to Internal Network / Auth Only
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://yamasee_backend;
    }

    # Main Application Proxy
    location / {
        proxy_pass http://yamasee_backend;
        proxy_http_version 1.1;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection & Timeout Settings
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffer Settings for Downloads
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
}
