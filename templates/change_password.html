<!DOCTYPE html>
<html lang="th" data-theme="day">
<head>
    {% include "partials/auth_theme_script.html" %}
    {% include "partials/auth_head.html" %}
    <link rel="stylesheet" href="/static/css/auth-forms.css?v=1.1.1">
    <script src="/static/js/change_password.js?v=1.1.1" defer></script>
</head>
<body>
    <div class="bg-mesh"></div>

    <header class="site-header">
        <a href="/landing" class="brand-logo">
            <img src="/static/Logo_boy.png" alt="YAMASEE Logo">
            <span>YAMASEE</span>
        </a>
        <div class="nav-actions">
            <button type="button" id="logoutBtn" class="btn btn-outline btn-logout"><span class="nav-text-effect" data-text="ออกจากระบบ"><span class="nav-text-base">ออกจากระบบ</span><span class="nav-text-hover" aria-hidden="true">ออกจากระบบ</span></span></button>
            {% include "partials/theme_switch.html" %}
        </div>
    </header>

    <main class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-card-header">
                <h1>🔐 เปลี่ยนรหัสผ่านใหม่</h1>
                <p>กรุณาตั้งรหัสผ่านใหม่เพื่อความปลอดภัยของบัญชีคุณ</p>
            </div>

            <div id="alertBanner" class="alert-banner" role="alert" aria-live="polite"></div>

            <form id="changePasswordForm" novalidate>
                <div class="form-group">
                    <label for="currentPassword" class="form-label">รหัสผ่านปัจจุบัน (หรือรหัสผ่านชั่วคราว)</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="currentPassword" name="currentPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" data-target="currentPassword">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword" class="form-label">รหัสผ่านใหม่</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" data-target="newPassword">Show</button>
                    </div>
                    <span style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; display: block;">
                        * ต้องมีความยาวอย่างน้อย 8 ตัวอักษร มีตัวอักษรและตัวเลขอย่างน้อยอย่างละ 1 ตัว
                    </span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">ยืนยันรหัสผ่านใหม่</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" data-target="confirmPassword">Show</button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-submit">
                    <span id="submitSpinner" class="spinner" style="display: none;"></span>
                    <span id="submitBtnText">เปลี่ยนรหัสผ่านและเข้าสู่แดชบอร์ด</span>
                </button>
            </form>
        </div>
    </main>
</body>
</html>
